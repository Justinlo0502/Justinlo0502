<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 280" width="1000" height="280" role="img" aria-label="Justin Lo - digital design, FPGA, PCB and embedded">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1f17"/>
      <stop offset="1" stop-color="#071018"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ddc97"/>
      <stop offset="1" stop-color="#4cc9f0"/>
    </linearGradient>
    <style>
      .title { font: 700 56px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #f2f7f5; }
      .sub { font: 400 22px 'Consolas', 'Courier New', monospace; fill: #9fb8ad; }
      .tag { font: 400 20px 'Consolas', 'Courier New', monospace; fill: url(#accent); }
      .trace { fill: none; stroke: #3ddc97; stroke-width: 2; opacity: .35; stroke-linecap: round; stroke-linejoin: round; }
      .pad { fill: #3ddc97; opacity: .55; }
      .pulse { fill: none; stroke: #4cc9f0; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 40 960; opacity: .9;
               animation: run 5s linear infinite; }
      .pulse.b { animation-duration: 7s; animation-delay: -2s; stroke: #3ddc97; }
      .pulse.c { animation-duration: 6s; animation-delay: -4s; }
      @keyframes run { from { stroke-dashoffset: 1000; } to { stroke-dashoffset: 0; } }
      .cursor { animation: blink 1s steps(1) infinite; fill: #4cc9f0; }
      @keyframes blink { 50% { opacity: 0; } }
      .line { opacity: 0; animation: show 12s infinite; }
      .l1 { animation-delay: 0s; } .l2 { animation-delay: 3s; } .l3 { animation-delay: 6s; } .l4 { animation-delay: 9s; }
      @keyframes show { 0% {opacity:0} 3% {opacity:1} 22% {opacity:1} 25% {opacity:0} 100% {opacity:0} }
      @media (prefers-reduced-motion: reduce) { .pulse, .cursor, .line { animation: none; } .l1 { opacity: 1; } }
    </style>
  </defs>
  <rect width="1000" height="280" rx="14" fill="url(#bg)"/>

  <!-- PCB-style traces -->
  <path id="t1" class="trace" d="M0 60 H300 L330 90 H620 L650 60 H1000"/>
  <path id="t2" class="trace" d="M0 220 H220 L250 190 H560 L590 220 H1000"/>
  <path id="t3" class="trace" d="M700 0 V110 L730 140 H1000"/>
  <circle class="pad" cx="300" cy="60" r="5"/><circle class="pad" cx="650" cy="60" r="5"/>
  <circle class="pad" cx="220" cy="220" r="5"/><circle class="pad" cx="590" cy="220" r="5"/>
  <circle class="pad" cx="700" cy="110" r="5"/>
  <use href="#t1" class="pulse"/>
  <use href="#t2" class="pulse b"/>
  <use href="#t3" class="pulse c"/>

  <text x="60" y="130" class="title">Justin Lo</text>
  <text x="62" y="170" class="sub">ECE @ University of Toronto</text>

  <g transform="translate(62 218)">
    <text class="tag line l1">&gt; FPGA &amp; digital design</text>
    <text class="tag line l2">&gt; RISC-V multicore on DE1-SoC</text>
    <text class="tag line l3">&gt; PCB design + STM32 firmware</text>
    <text class="tag line l4">&gt; HPVDT: human-powered speed</text>
  </g>
</svg>
